<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Voice Coach</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d2433; --muted: #5d6678;
    --accent: #3b5bdb; --accent-ink: #ffffff; --live: #d6336c; --line: #dcdad2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --card: #1e2330; --ink: #eceef4; --muted: #9aa3b8;
            --accent: #7c93ff; --accent-ink: #0f1220; --live: #ff6b9a; --line: #2e3446; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
  main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line);
         border-radius: 16px; padding: 24px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 1.1rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  #coach { font-size: 1.7rem; font-weight: 700; margin: 0; }
  #title { color: var(--muted); margin: 2px 0 0; }
  #log { min-height: 180px; max-height: 40vh; overflow-y: auto; display: grid; gap: 10px; align-content: start; }
  .msg { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); white-space: pre-wrap; }
  .msg.you { justify-self: end; background: var(--accent); color: var(--accent-ink); border-color: transparent; max-width: 85%; }
  .msg.bot { justify-self: start; max-width: 92%; }
  .msg.sys { color: var(--muted); font-size: .9rem; border-style: dashed; }
  #status { color: var(--muted); min-height: 1.5em; text-align: center; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .controls #mic { flex-basis: 96px; margin: 0 calc(50% - 48px); }
  button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
           background: transparent; color: var(--ink); padding: 12px 22px; min-height: 48px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #mic { width: 96px; height: 96px; padding: 0; background: var(--accent); color: var(--accent-ink);
         border: none; display: grid; place-items: center; }
  #mic svg { width: 40px; height: 40px; }
  #mic.live { background: var(--live); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--live) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { #mic.live { animation: none; } }
  #demo[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 8px; text-align: center; }
  #chipList { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #chipList button { padding: 6px 14px; min-height: 36px; font-size: .9rem; }
  #typed { display: none; gap: 8px; }
  #typed.show { display: flex; }
  #typed input { flex: 1; font: inherit; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line);
                 background: transparent; color: var(--ink); min-width: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Canvas Voice Coach</h1>
    <p id="coach">Loading…</p>
    <p id="title"></p>
  </header>

  <div id="log" aria-live="polite"></div>
  <p id="status"></p>

  <div class="controls">
    <button id="mic" aria-label="Talk to the coach" title="Talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v4"></path>
      </svg>
    </button>
    <button id="swap">Swap coach</button>
    <button id="demo" aria-pressed="false">Demo mode: Off</button>
    <button id="runDemo">&#9654; Run demo</button>
  </div>

  <div id="chips" hidden>
    <p class="hint">Demo mode: scripted answers. Speak one of these or click it.</p>
    <div id="chipList"></div>
  </div>

  <form id="typed">
    <input id="typedInput" placeholder="Speech recognition not supported here. Type instead." aria-label="Type a message" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let personas = {}, keys = [], current = 0, greeted = false, busy = false, recog = null, audio = null, demo = false, running = false, examples = [];

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function status(t) { $("status").textContent = t; }
function setBusy(b) {
  busy = b || running;
  for (const el of document.querySelectorAll("#mic, #swap, #demo, #chipList button")) el.disabled = busy;
  $("runDemo").disabled = b && !running;  // stays clickable during a run so it can be stopped
}

function play(b64) {
  return new Promise((resolve) => {
    if (!b64) return resolve();
    if (audio) audio.pause();
    audio = new Audio("data:audio/mpeg;base64," + b64);
    audio.onended = audio.onerror = () => resolve();
    audio.play().catch(resolve);
  });
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("Server error " + r.status);
  return r.json();
}

function showCoach() {
  const p = personas[keys[current]];
  $("coach").textContent = p.name;
  $("title").textContent = p.title;
}

async function greet() {
  setBusy(true); status("Waking up…");
  try {
    const d = await post("/api/greeting", { persona: keys[current] });
    add("bot", d.text); greeted = true;
    status("Speaking…"); await play(d.audio);
  } catch (e) { add("sys", "Could not reach the server. Is web_app.py running?"); }
  status(""); setBusy(false);
}

async function ask(text) {
  add("you", text); setBusy(true); status("Thinking…");
  try {
    const d = await post("/api/chat", { persona: keys[current], text, demo });
    add("bot", d.text);
    status("Speaking…"); await play(d.audio);
  } catch (e) { add("sys", "Something went wrong talking to the server."); }
  status(""); setBusy(false);
}

function listen() {
  recog = new SR();
  recog.lang = "en-US"; recog.interimResults = false; recog.maxAlternatives = 1;
  $("mic").classList.add("live"); status("Listening…");
  let heard = "";
  recog.onresult = (e) => { heard = e.results[0][0].transcript; };
  recog.onerror = (e) => {
    $("mic").classList.remove("live");
    status(e.error === "not-allowed" ? "Microphone blocked. Allow it in the address bar." :
           e.error === "no-speech" ? "I didn't hear anything. Try again." : "Speech error: " + e.error);
  };
  recog.onend = () => {
    $("mic").classList.remove("live");
    if (heard) ask(heard);
  };
  recog.start();
}

$("mic").onclick = async () => {
  if (busy) return;
  if (recog && $("mic").classList.contains("live")) { recog.stop(); return; }
  if (!greeted) await greet();
  if (SR) listen(); else $("typed").classList.add("show");
};

$("swap").onclick = async () => {
  if (busy) return;
  current = (current + 1) % keys.length;
  showCoach();
  add("sys", "Switched to " + personas[keys[current]].name);
  await greet();
};

function setDemo(on) {
  demo = on;
  $("demo").setAttribute("aria-pressed", demo);
  $("demo").textContent = "Demo mode: " + (demo ? "On" : "Off");
  $("chips").hidden = !demo;
}

$("demo").onclick = () => {
  if (busy) return;
  setDemo(!demo);
  add("sys", demo ? "Demo mode on: scripted answers (live Canvas data, no Gemini)." : "Demo mode off: live Gemini answers.");
};

const pause = (ms) => new Promise((r) => setTimeout(r, ms));

$("runDemo").onclick = async () => {
  if (running) { running = false; $("runDemo").textContent = "Stopping…"; return; }
  if (busy) return;
  running = true; $("runDemo").textContent = "■ Stop demo";
  setDemo(true);
  add("sys", "Running the scripted demo. Press Stop to end it.");
  const other = (current + 1) % keys.length;
  const steps = examples.map((q) => [current, q]).concat([[other, "Who are you?"], [other, "What day is it?"]]);
  if (!greeted) await greet();
  let last = current;
  for (const [who, q] of steps) {
    if (!running) break;
    if (who !== last) {                      // swap to the other coach for the finale
      current = who; last = who; showCoach();
      add("sys", "Switched to " + personas[keys[current]].name);
      await greet();
      if (!running) break;
    }
    await pause(800);
    if (!running) break;
    await ask(q);
  }
  running = false; $("runDemo").textContent = "▶ Run demo"; setBusy(false);
  add("sys", "Demo finished.");
};

$("typed").onsubmit = (e) => {
  e.preventDefault();
  const v = $("typedInput").value.trim();
  if (v && !busy) { $("typedInput").value = ""; ask(v); }
};

(async function init() {
  try {
    const s = await (await fetch("/api/state")).json();
    personas = s.personas; keys = Object.keys(personas); showCoach();
    examples = s.demo_examples || [];
    for (const q of examples) {
      const b = document.createElement("button");
      b.textContent = q;
      b.onclick = async () => { if (!busy) { if (!greeted) await greet(); ask(q); } };
      $("chipList").appendChild(b);
    }
    if (!s.mcp_connected) add("sys", "Canvas is not connected, so I can chat but not look up courses.");
    status("Press the mic to start.");
  } catch (e) { $("coach").textContent = "Server not running"; }
  if (!SR) $("typed").classList.add("show");
})();
</script>
</body>
</html>
